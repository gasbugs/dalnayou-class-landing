<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>E-011 Gemini 노트북 업무 문제형 광고 후보</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      display: flex;
      min-height: 100vh;
      align-items: flex-start;
      justify-content: center;
      background: #d9dce1;
      color: #171717;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
      letter-spacing: 0;
    }
    .creative {
      --accent: #175cd3;
      --accent-soft: #eaf2ff;
      display: flex;
      position: relative;
      width: 1080px;
      height: 1350px;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
    }
    .story {
      height: 1920px;
    }
    .proof {
      display: flex;
      min-height: 102px;
      align-items: center;
      justify-content: space-between;
      padding: 0 68px;
      background: #16181d;
      color: #fff;
      font-size: 26px;
      font-weight: 800;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .brand img {
      width: 190px;
      height: 60px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .proof strong {
      color: #ffd54a;
      font-size: 27px;
    }
    .copy {
      padding: 48px 68px 38px;
      background: #f8fafc;
    }
    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 29px;
      font-weight: 900;
    }
    h1 {
      margin: 16px 0 0;
      font-size: 70px;
      line-height: 1.13;
      font-weight: 900;
    }
    h1 em {
      color: var(--accent);
      font-style: normal;
    }
    .subcopy {
      margin: 22px 0 0;
      color: #414651;
      font-size: 29px;
      line-height: 1.45;
      font-weight: 700;
    }
    .workplace {
      position: relative;
      height: 480px;
      overflow: hidden;
      background: #dbe6f3;
    }
    .workplace img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 45%;
    }
    .workplace::after {
      content: "내 자료에 근거한 업무 결과물을 직접 완성";
      position: absolute;
      left: 44px;
      bottom: 36px;
      padding: 15px 22px;
      background: rgba(17, 24, 39, 0.9);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
    }
    .details {
      display: grid;
      flex: 1;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 28px;
      padding: 34px 68px 40px;
      background: #fff;
      border-top: 8px solid var(--accent);
    }
    .facts {
      display: grid;
      gap: 10px;
      font-size: 26px;
      line-height: 1.35;
      font-weight: 800;
    }
    .facts .price {
      color: var(--accent);
      font-size: 29px;
    }
    .cta {
      display: flex;
      min-width: 258px;
      min-height: 98px;
      align-items: center;
      justify-content: center;
      padding: 0 30px;
      background: var(--accent);
      color: #fff;
      font-size: 30px;
      font-weight: 900;
    }
    .story .proof {
      min-height: 128px;
      padding: 0 64px;
    }
    .story .copy {
      padding: 86px 68px 62px;
    }
    .story .eyebrow {
      font-size: 34px;
    }
    .story h1 {
      margin-top: 24px;
      font-size: 91px;
      line-height: 1.11;
    }
    .story .subcopy {
      margin-top: 32px;
      font-size: 35px;
    }
    .story .workplace {
      height: 710px;
    }
    .story .workplace::after {
      left: 52px;
      bottom: 45px;
      font-size: 28px;
    }
    .story .details {
      grid-template-columns: 1fr;
      align-content: center;
      padding: 54px 68px 178px;
    }
    .story .facts {
      gap: 14px;
      font-size: 33px;
    }
    .story .facts .price {
      font-size: 36px;
    }
    .story .cta {
      width: 100%;
      min-height: 112px;
      margin-top: 24px;
      font-size: 36px;
    }
  </style>
</head>
<body>
  <main id="creative" class="creative">
    <div class="proof">
      <div class="brand">
        <img src="../images/cloud-security-lab-logo.png" alt="" />
        <span>클씨랩 오프라인 AI 클래스</span>
      </div>
      <strong>기업·금융·공공 교육 10년+</strong>
    </div>
    <div class="copy">
      <p class="eyebrow">Google NotebookLM 실전 4주</p>
      <h1>쌓여만 가는<br />회의록·보고서,<br /><em>AI가 먼저 읽게 하세요</em></h1>
      <p class="subcopy">내 자료에 근거한 요약·업무 브리핑·마인드맵·<br />오디오 브리핑을 직접 완성합니다.</p>
    </div>
    <div class="workplace">
      <img src="assets/notebooklm-workplace-generic-v2.webp" alt="" />
    </div>
    <div class="details">
      <div class="facts">
        <div>8/16 개강 · 매주 일요일 오전 9~12시</div>
        <div>소사역 힐스에비뉴 · 잔여석 마감 임박</div>
        <div class="price">정상가 249,000원 · 8/1까지 189,000원</div>
      </div>
      <div class="cta">내 업무에 적용하기</div>
    </div>
  </main>
  <script>
    const format = new URLSearchParams(window.location.search).get("format");
    if (format === "story") {
      document.getElementById("creative").classList.add("story");
    }
  </script>
</body>
</html>
