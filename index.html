<!DOCTYPE html>
<html lang="ko">
<head>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="달나유 AI·코딩 4주 클래스 선택" />
  <meta property="og:description" content="게임을 만드는 로블록스 AI, 공부 자료를 정리하는 구글 AI - NotebookLM. 부천 소사 오프라인 4주 실습 클래스." />
  <meta property="og:image" content="https://gasbugs.github.io/dalnayou-class-landing/images/classroom.jpg" />
  <meta property="og:url" content="https://gasbugs.github.io/dalnayou-class-landing/" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 900:'#14100D' },
            orangeBrand: { 500:'#FF7A45', 600:'#EA580C' },
            blueBrand: { 500:'#2563EB', 700:'#1E40AF' }
          },
          fontFamily: { sans: ['Pretendard','-apple-system','BlinkMacSystemFont','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <style>
    html, body { min-height: 100%; }
    body { font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif; }
    .choice-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.38), rgba(0,0,0,.78)),
        linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,.08));
      transition: background .25s ease;
      z-index: 0;
    }
    .choice-panel:hover::before {
      background:
        linear-gradient(180deg, rgba(0,0,0,.32), rgba(0,0,0,.72)),
        linear-gradient(90deg, rgba(0,0,0,.14), rgba(0,0,0,.06));
    }
    .white-copy { text-shadow: 0 3px 8px rgba(0,0,0,.95), 0 12px 28px rgba(0,0,0,.9); }
    @media (max-width: 767px) {
      .choice-panel::before {
        background:
          linear-gradient(180deg, rgba(0,0,0,.34), rgba(0,0,0,.82)),
          linear-gradient(90deg, rgba(0,0,0,.14), rgba(0,0,0,.08));
      }
    }
  </style>
</head>
<body class="bg-ink-900 text-white antialiased">
  <main class="relative min-h-screen overflow-hidden">
    <div class="absolute left-0 right-0 top-0 z-20 flex items-center justify-between px-5 py-4 md:px-8">
      <a href="./" aria-label="CLOUD SECURITY LAB 통합 페이지">
        <img src="https://i.imgur.com/NOmCfwO.png" alt="CLOUD SECURITY LAB" class="h-8 w-auto brightness-0 invert" />
      </a>
      <div class="flex items-center gap-2">
        <button type="button" data-share-button data-track-event="share_click" data-track-label="main_split_share" class="rounded-full bg-white/95 px-4 py-2 text-sm font-extrabold text-ink-900 shadow-lg">공유</button>
        <a href="http://pf.kakao.com/_xeKJxen/chat" target="_blank" rel="noopener" data-track-event="contact_click" data-track-label="main_split_kakao" class="rounded-full bg-yellow-300 px-4 py-2 text-sm font-extrabold text-ink-900 shadow-lg">카톡 문의</a>
      </div>
    </div>

    <section class="grid min-h-screen grid-rows-2 md:grid-cols-2 md:grid-rows-1">
      <a href="./roblox.html" data-track-event="course_click" data-track-label="main_split_roblox" class="choice-panel group relative flex min-h-[50vh] items-end overflow-hidden bg-ink-900 p-6 pb-16 md:min-h-screen md:p-10">
        <img src="images/roblox_screen.png" alt="로블록스 AI 클래스" class="absolute inset-0 h-full w-full object-cover transition duration-500 group-hover:scale-105" />
        <div class="choice-content relative z-10 max-w-xl">
          <div class="mb-4 inline-flex rounded-full bg-orangeBrand-500 px-3 py-1 text-xs font-extrabold text-white shadow-lg">초4 이상·비전공자·아빠 · 일 14:00~17:00</div>
          <h1 class="white-copy text-[2.3rem] font-extrabold leading-[1.05] md:text-6xl">
            로블록스 AI<br />4주 클래스
          </h1>
          <p class="white-copy mt-4 text-base font-bold leading-relaxed text-white/95 md:text-xl">
            게임만 하던 아이가<br class="md:hidden" /> 직접 로블록스 게임을<br />만듭니다.
          </p>
          <div class="mt-7 inline-flex items-center rounded-full bg-white px-5 py-3 text-sm font-extrabold text-orangeBrand-600">
            로블록스 수업 보기
          </div>
        </div>
      </a>

      <a href="./notebooklm.html" data-track-event="course_click" data-track-label="main_split_notebooklm" class="choice-panel group relative flex min-h-[50vh] items-end overflow-hidden bg-ink-900 p-6 pb-16 md:min-h-screen md:p-10">
        <img src="images/notebooklm.png" alt="구글 AI - NotebookLM 클래스" class="absolute inset-0 h-full w-full object-cover transition duration-500 group-hover:scale-105" />
        <div class="choice-content relative z-10 max-w-xl">
          <div class="mb-4 inline-flex rounded-full bg-blueBrand-500 px-3 py-1 text-xs font-extrabold text-white shadow-lg">학생·비전공자·직장인 · 일 09:00~12:00</div>
          <h2 class="white-copy text-[2.3rem] font-extrabold leading-[1.05] md:text-6xl">
            구글 AI<br />NotebookLM
          </h2>
          <p class="white-copy mt-4 text-base font-bold leading-relaxed text-white/95 md:text-xl">
            공부·업무 자료를 AI로 정리하고<br class="md:hidden" /> 내 말로 설명하는 힘을 기릅니다.
          </p>
          <div class="mt-7 inline-flex items-center rounded-full bg-white px-5 py-3 text-sm font-extrabold text-blueBrand-700">
            NotebookLM 수업 보기
          </div>
        </div>
      </a>
    </section>

  </main>
  <script>
    const shareUrl = 'https://gasbugs.github.io/dalnayou-class-landing/';
    const shareData = {
      title: '달나유 AI·코딩 4주 클래스',
      text: '로블록스 AI와 구글 AI - NotebookLM 중 맞는 수업을 선택해보세요.',
      url: shareUrl
    };
    document.querySelectorAll('[data-share-button]').forEach((button) => {
      button.addEventListener('click', async () => {
        if (navigator.share) {
          await navigator.share(shareData);
          return;
        }
        await navigator.clipboard.writeText(shareUrl);
        alert('공유 링크를 복사했습니다.');
      });
    });
  </script>
</body>
</html>
