<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">소사역 4번 출구에서 B107 클라우드시큐리티랩까지 가는 같은 층 안내도</title>
  <desc id="desc">소사역 1호선과 서해선, 4번 출구 위치, 그리고 4번 출구와 같은 층 레벨에서 경인옛로 37 B107 클라우드시큐리티랩까지 약 1분 이동하는 상가 내부 동선을 보여주는 약식 안내도</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f1410" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="960" height="600" rx="36" fill="#fffaf3"/>

  <g filter="url(#shadow)">
    <rect x="42" y="42" width="176" height="92" rx="18" fill="#111827"/>
    <rect x="42" y="124" width="176" height="10" fill="#c2410c"/>
    <text x="130" y="99" text-anchor="middle" fill="#ffffff" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="52" font-weight="900">B1F</text>
  </g>
  <text x="250" y="70" fill="#1f1410" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="31" font-weight="900">소사역 4번 출구와 같은 층</text>
  <text x="250" y="106" fill="#15803d" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="27" font-weight="900">도보 약 1분 · 상가 연결 동선</text>

  <!-- 소사역 라인 약식 지도 -->
  <g filter="url(#shadow)">
    <rect x="78" y="154" width="804" height="126" rx="28" fill="#ffffff" stroke="#e8dccf" stroke-width="4"/>
    <path d="M112 214 C270 208 430 207 620 206 C725 205 810 208 858 212" fill="none" stroke="#1f3a9d" stroke-width="30" stroke-linecap="round"/>
    <text x="728" y="199" fill="#ffffff" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="900">1호선(경인선)</text>
    <path d="M360 160 C376 194 392 234 412 276" fill="none" stroke="#84c341" stroke-width="28" stroke-linecap="round"/>
    <path d="M360 160 C376 194 392 234 412 276" fill="none" stroke="#52a315" stroke-width="4"/>
    <text x="423" y="255" transform="rotate(68 423 255)" fill="#2f7d16" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="900">서해선</text>
    <rect x="344" y="178" width="156" height="74" rx="18" fill="#ffffff" stroke="#d9d3c8" stroke-width="3"/>
    <text x="422" y="211" text-anchor="middle" fill="#1f1410" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="900">소사역</text>
    <text x="422" y="238" text-anchor="middle" fill="#2947b5" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="900">1호선 · 서해선</text>
    <circle cx="498" cy="255" r="28" fill="#15803d" stroke="#ffffff" stroke-width="6"/>
    <text x="498" y="265" text-anchor="middle" fill="#ffffff" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="900">4</text>
    <text x="542" y="263" fill="#15803d" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="900">4번 출구</text>
    <text x="542" y="291" fill="#6f5a49" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="800">같은 층 레벨로 상가 연결</text>
  </g>

  <!-- B1F 평면도 약식 안내 -->
  <g opacity=".94">
    <path d="M104 318 L790 320 L858 548 L158 552 Z" fill="#f7f5ef" stroke="#ded8ca" stroke-width="5"/>
    <path d="M200 350 L404 344 L380 416 L162 414 Z" fill="#d9eef2" stroke="#9ab6bf" stroke-width="3"/>
    <path d="M442 344 L810 350 L806 430 L432 424 Z" fill="#d9eef2" stroke="#9ab6bf" stroke-width="3"/>
    <path d="M160 442 L306 452 L308 530 L130 520 Z" fill="#d7a765" stroke="#b9853f" stroke-width="3"/>
    <path d="M326 436 L424 446 L424 534 L322 528 Z" fill="#d7a765" stroke="#b9853f" stroke-width="3"/>
    <path d="M456 442 L818 448 L844 528 L454 532 Z" fill="#d9eef2" stroke="#9ab6bf" stroke-width="3"/>
    <path d="M210 330 L150 386 L232 452 L426 548 L536 532 L342 430 L390 368 L410 340 Z" fill="#ffffff" stroke="#d8d3c8" stroke-width="4"/>
    <path d="M430 335 L424 532" fill="none" stroke="#d8d3c8" stroke-width="7"/>
    <path d="M528 352 L520 528" fill="none" stroke="#d8d3c8" stroke-width="7"/>
  </g>

  <path d="M498 284 C455 314 382 344 322 392 C274 430 302 466 394 508 C456 536 518 540 590 520" fill="none" stroke="#15803d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M498 284 C455 314 382 344 322 392 C274 430 302 466 394 508 C456 536 518 540 590 520" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>

  <g filter="url(#shadow)">
    <rect x="616" y="454" width="322" height="88" rx="26" fill="#ffffff" stroke="#b7e0c2" stroke-width="5"/>
    <path d="M590 386 C556 386 530 413 530 447 C530 490 590 542 590 542 C590 542 650 490 650 447 C650 413 624 386 590 386 Z" fill="#15803d"/>
    <circle cx="590" cy="447" r="26" fill="#ffffff"/>
    <text x="590" y="456" text-anchor="middle" fill="#15803d" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="900">B1</text>
    <text x="780" y="489" text-anchor="middle" fill="#1f1410" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="26" font-weight="900">클라우드시큐리티랩</text>
    <text x="780" y="522" text-anchor="middle" fill="#15803d" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="900">경인옛로 37 B107</text>
  </g>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="800">
    <rect x="76" y="500" width="350" height="64" rx="22" fill="#1f1410" opacity=".9"/>
    <text x="106" y="526" fill="#ffffff" font-size="19">정확한 길찾기는 지도 버튼에서 확인</text>
    <text x="106" y="552" fill="#fde68a" font-size="17">내려가는 안내가 아닌 같은 층 이동 안내</text>
    <rect x="684" y="334" width="150" height="42" rx="14" fill="#d9eef2" stroke="#9ab6bf" stroke-width="3"/>
    <text x="759" y="362" text-anchor="middle" fill="#46606a" font-size="16">판매시설</text>
    <rect x="684" y="386" width="150" height="42" rx="14" fill="#d7a765" stroke="#b9853f" stroke-width="3"/>
    <text x="759" y="414" text-anchor="middle" fill="#7c4f16" font-size="16">커뮤니티 시설</text>
  </g>
</svg>
