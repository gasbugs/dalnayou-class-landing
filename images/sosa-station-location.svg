<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">소사역 4번 출구 방면 달나유 이음센터 위치 안내도</title>
  <desc id="desc">소사역, 4번 출구 방면, 경인로, 힐스테이트소사역 상가 B1층 달나유 이음센터를 단순화해 보여주는 안내도</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1f1410" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="960" height="600" rx="36" fill="#fffaf3"/>
  <path d="M-40 300 C160 285 370 300 570 315 C730 327 870 324 1000 314 L1000 395 C790 410 600 392 410 382 C250 374 108 378 -40 392 Z" fill="#fff0b8"/>
  <path d="M-40 340 C185 326 345 337 560 352 C740 365 862 358 1000 352" fill="none" stroke="#f5d889" stroke-width="5"/>
  <text x="55" y="365" fill="#9a6a17" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800">경인로</text>

  <path d="M-30 160 C200 150 430 148 690 146 C810 145 905 148 990 154" fill="none" stroke="#1f3a9d" stroke-width="40" stroke-linecap="round"/>
  <path d="M-30 160 C200 150 430 148 690 146 C810 145 905 148 990 154" fill="none" stroke="#2947b5" stroke-width="3"/>
  <text x="510" y="137" fill="#ffffff" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800">1호선(경인선)</text>

  <path d="M350 -40 C370 85 395 198 430 310 C465 420 500 510 536 640" fill="none" stroke="#84c341" stroke-width="34" stroke-linecap="round"/>
  <path d="M350 -40 C370 85 395 198 430 310 C465 420 500 510 536 640" fill="none" stroke="#52a315" stroke-width="4"/>
  <text x="438" y="448" transform="rotate(72 438 448)" fill="#2f7d16" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="800">서해선</text>

  <g filter="url(#shadow)">
    <rect x="350" y="112" width="190" height="108" rx="22" fill="#ffffff"/>
    <text x="445" y="154" text-anchor="middle" fill="#1f1410" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="900">소사역</text>
    <text x="445" y="188" text-anchor="middle" fill="#2947b5" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="800">1호선 · 서해선</text>
  </g>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-weight="900">
    <circle cx="525" cy="210" r="24" fill="#fff4bf" stroke="#d7a600" stroke-width="4"/>
    <text x="525" y="219" text-anchor="middle" fill="#1f1410" font-size="24">1</text>
    <circle cx="375" cy="210" r="24" fill="#fff4bf" stroke="#d7a600" stroke-width="4"/>
    <text x="375" y="219" text-anchor="middle" fill="#1f1410" font-size="24">2</text>
    <circle cx="300" cy="116" r="24" fill="#fff4bf" stroke="#d7a600" stroke-width="4"/>
    <text x="300" y="125" text-anchor="middle" fill="#1f1410" font-size="24">3</text>
    <circle cx="505" cy="418" r="28" fill="#15803d" stroke="#ffffff" stroke-width="6"/>
    <text x="505" y="428" text-anchor="middle" fill="#ffffff" font-size="28">4</text>
    <circle cx="280" cy="335" r="24" fill="#fff4bf" stroke="#d7a600" stroke-width="4"/>
    <text x="280" y="344" text-anchor="middle" fill="#1f1410" font-size="24">5</text>
  </g>

  <path d="M525 418 C590 410 635 398 690 370" fill="none" stroke="#15803d" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 14" marker-end="url(#arrow)"/>
  <text x="545" y="388" fill="#15803d" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="26" font-weight="900">4번 출구 방면</text>

  <g filter="url(#shadow)">
    <rect x="655" y="286" width="260" height="150" rx="28" fill="#ffffff" stroke="#b7e0c2" stroke-width="4"/>
    <path d="M785 246 C745 246 713 278 713 318 C713 368 785 426 785 426 C785 426 857 368 857 318 C857 278 825 246 785 246 Z" fill="#15803d"/>
    <circle cx="785" cy="318" r="28" fill="#ffffff"/>
    <text x="785" y="326" text-anchor="middle" fill="#15803d" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="900">B1</text>
    <text x="785" y="468" text-anchor="middle" fill="#1f1410" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="900">달나유 이음센터</text>
    <text x="785" y="504" text-anchor="middle" fill="#15803d" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="900">힐스테이트소사역 상가 B1층</text>
  </g>

  <g>
    <rect x="54" y="464" width="420" height="72" rx="24" fill="#1f1410" opacity=".9"/>
    <text x="84" y="493" fill="#ffffff" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="800">정확한 길찾기는 카카오맵·네이버지도 버튼에서 확인</text>
    <text x="84" y="522" fill="#fde68a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="800">소사역 4번 출구 방면 안내용 약식 지도</text>
  </g>
</svg>
